<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<meta charset="utf-8">
<title>Kadal for Publishers V2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark stage, keynote rhythm. Full-bleed bands, 1320px content, the knowledge graph is the one bold object. */
:root{
  /* Light page, warm white. Two dark stages (hero, knowledge graph). One orange band (proof). */
  color-scheme:light;
  --stage:#FAF9F7;        /* page ground */
  --stage-2:#F1EEEA;      /* alternate band */
  --stage-3:#FFFFFF;      /* cards and controls */
  --line:#E4E0DA;
  --line-2:#D3CEC7;
  --fg:#16151A;           /* ink */
  --fg-2:#4D4A46;
  --fg-3:#69655F;         /* quiet labels, 5:1 on the ground */
  --signal:#F2551B;       /* Straive orange */
  --signal-text:#C2410C;  /* orange for small text on light */
  --signal-ink:#1A0B04;
  --signal-soft:rgba(242,85,27,.10);
  --k12:#E0A21F; --he:#3D7FE6; --wf:#1F9E6A; --miss:#E04F3F; --amber:#C98512;
  /* dark stage palette, applied by .dark */
  --d-stage:#0D0D0F; --d-stage-2:#141417; --d-stage-3:#1C1C21; --d-line:#2A2A31; --d-line-2:#3A3A43;
  --d-fg:#F2F0ED; --d-fg-2:#B9B4AE; --d-fg-3:#8E8A84;
  --d-k12:#F2B441; --d-he:#6AA4FF; --d-wf:#46C98F; --d-miss:#FF7A6B; --d-amber:#FFB547;
  --f-display:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px; --pill:999px;
  --ease:cubic-bezier(.23,1,.32,1);
}
.dark{
  color-scheme:dark;
  --stage:var(--d-stage); --stage-2:var(--d-stage-2); --stage-3:var(--d-stage-3); --line:var(--d-line); --line-2:var(--d-line-2);
  --fg:var(--d-fg); --fg-2:var(--d-fg-2); --fg-3:var(--d-fg-3); --signal-text:#FF6A33; --signal-soft:rgba(255,90,31,.14);
  --k12:var(--d-k12); --he:var(--d-he); --wf:var(--d-wf); --miss:var(--d-miss); --amber:var(--d-amber);
  background:var(--stage); color:var(--fg);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px;background:var(--stage)}
body{background:var(--stage);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#FAF9F7}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.035em;line-height:1.02}
p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal-text)}
.lede{color:var(--fg-2);font-size:19px;line-height:1.55;max-width:56ch}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:var(--pill);padding:14px 22px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .16s var(--ease),background .2s ease,box-shadow .2s ease}
.btn:active,.chip:active,.gcard .links button:active,.prompts button:active,.sol .tabs button:active,.kbp-tab:active,.approve:active{transform:scale(.97)}
.btn-primary{background:var(--signal);color:var(--signal-ink)}
@media (hover:hover) and (pointer:fine){.btn-primary:hover{background:#FF6A33;box-shadow:0 10px 30px -12px rgba(242,85,27,.7)}}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--fg-2)}
.btn .arr{transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--pill);padding:8px 14px;font-size:14px;background:var(--stage-3);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s ease,color .2s ease,box-shadow .2s ease,transform .16s var(--ease)}
.chip:hover{color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--stage);box-shadow:none}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,249,247,.86);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.brand img{height:20px;width:auto;max-width:none;display:block;object-fit:contain}
.brand .kw{height:24px;width:auto;color:var(--fg);display:block}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:30px;font-size:15px;color:var(--fg-2)}
.nav ul a:hover{color:var(--fg)}
@media (max-width:900px){.nav ul{display:none}}

/* Hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,13,15,.92) 0%,rgba(13,13,15,.6) 34%,rgba(13,13,15,0) 60%);pointer-events:none}
.hero .wrap{position:relative;z-index:2;padding-block:120px 104px;min-height:min(760px,88dvh);display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(44px,6.2vw,96px);letter-spacing:-.05em;line-height:.98;max-width:15ch}
.hero h1 em{font-style:normal;color:var(--signal)}
.hero .lede{margin-top:28px;max-width:44ch}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.hero-hint{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:28px;z-index:2;color:var(--fg-3)}
@media (max-width:760px){.hero::after{background:linear-gradient(180deg,rgba(13,13,15,.2) 0%,rgba(13,13,15,.92) 55%)}.hero .wrap{padding-block:96px 72px}.hero-hint{display:none}}

/* Proof */
.proof{background:var(--signal);color:var(--signal-ink);--line:rgba(26,11,4,.18)}
.proof .stat span{color:rgba(26,11,4,.78)!important}
.proof .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding-block:0}
.proof .stat{padding:36px 24px 34px 0;border-right:1px solid var(--line);min-width:0}
.proof .stat:last-child{border-right:0}
.proof .stat+.stat{padding-left:24px}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:clamp(32px,3.4vw,48px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:10px;color:var(--fg-2);font-size:14.5px;line-height:1.4}
@media (max-width:900px){.proof .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.proof .stat{border-right:0;border-bottom:1px solid var(--line);padding:26px 12px 24px 0!important}.proof .stat:nth-child(even){padding-left:16px!important}.proof .stat:last-child{grid-column:1/-1;border-bottom:0}}

/* Problem: before and after */
.problem{padding-block:140px 120px}
.problem .grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:64px;align-items:end}
.problem h2{font-size:clamp(38px,5vw,72px)}
.problem h2 span{color:#9A958F}
.problem .lede{margin-top:28px}
.shift{border-left:1px solid var(--line);padding-left:40px}
.shift .from{font-family:var(--f-display);font-size:40px;letter-spacing:-.03em;color:var(--fg-3);position:relative;display:inline-block}
.shift .from::after{content:"";position:absolute;left:-4px;right:-4px;top:54%;height:2px;background:var(--fg-3);transform-origin:left;transform:scaleX(var(--strike,1));transition:transform 1s var(--ease) .2s}
.shift .to{font-family:var(--f-display);font-weight:600;font-size:clamp(72px,9vw,132px);letter-spacing:-.06em;line-height:.9;color:var(--signal-text);margin-top:14px;font-variant-numeric:tabular-nums}
.shift .to small{font-size:.32em;letter-spacing:-.02em;margin-left:10px;color:var(--fg)}
.shift p{color:var(--fg-2);margin-top:18px;max-width:30ch}
@media (max-width:900px){.problem{padding-block:96px 80px}.problem .grid{grid-template-columns:minmax(0,1fr);gap:48px}.shift{border-left:0;border-top:1px solid var(--line);padding:32px 0 0}}

/* Platform: Know, Build, Prove */
.platform{background:var(--stage-2);border-block:1px solid var(--line);padding-block:120px;overflow:hidden}
.platform h2{font-size:clamp(44px,6vw,96px);letter-spacing:-.05em}
.platform .head{display:flex;flex-direction:column;gap:20px;max-width:900px}
.kbp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;margin-top:64px;align-items:center}
.kbp-tabs{display:flex;flex-direction:column;gap:6px}
.kbp-tab{appearance:none;border:0;background:none;text-align:left;padding:22px 24px;border-radius:var(--r);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:baseline;transition:background .3s}
.kbp-tab .w{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:-.04em;color:var(--fg-3);transition:color .3s;grid-row:1/3}
.kbp-tab .t{font-weight:600;font-size:17px;color:var(--fg-2)}
.kbp-tab .d{font-size:15px;color:var(--fg-3);line-height:1.5;grid-column:2;display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease),color .3s ease}
.kbp-tab .d>span{overflow:hidden}
.kbp-tab[aria-selected="true"]{background:var(--stage-3)}
.kbp-tab[aria-selected="true"] .w{color:var(--signal-text)}
.kbp-tab[aria-selected="true"] .t{color:var(--fg)}
.kbp-tab[aria-selected="true"] .d{grid-template-rows:1fr;color:var(--fg-2)}
.kbp-tab .bar{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px;display:none}
.kbp-tab[aria-selected="true"] .bar{display:block}
.kbp-tab .bar i{display:block;height:100%;width:0;background:var(--signal)}
.kbp-tab[aria-selected="true"] .bar i.run{animation:fill 8s linear forwards}
.kbp.paused .kbp-tab .bar i.run{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.stack{position:relative;height:520px;perspective:1600px}
.plane{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:22px;transform-style:preserve-3d;transition:transform .9s var(--ease),opacity .6s,box-shadow .6s,border-color .6s;border:1px solid var(--line-2);background:rgba(255,255,255,.88);box-shadow:0 30px 60px -40px rgba(22,21,26,.35)}
.plane .lab{position:absolute;left:22px;top:18px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--fg-3);text-transform:uppercase}
.plane canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:22px}
.plane.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal),0 40px 80px -40px rgba(242,85,27,.55)}
.plane.on .lab{color:var(--signal-text)}
@media (max-width:980px){.kbp{grid-template-columns:minmax(0,1fr);gap:24px}.stack{height:420px;order:-1}.plane{width:320px;height:320px;margin:-160px 0 0 -160px}}
@media (max-width:420px){.plane{width:270px;height:270px;margin:-135px 0 0 -135px}}

/* Graph */
.graph-sec{padding-block:120px 96px}
.graph-sec h2{font-size:clamp(44px,6vw,96px);letter-spacing:-.05em;margin-top:18px}
.graph-sec .lede{margin-top:22px}
.gbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-top:44px}
.gbar .grp{display:flex;flex-wrap:wrap;gap:8px}
.gstage{position:relative;margin-top:16px;height:clamp(560px,74vh,780px);border-radius:24px;background:radial-gradient(120% 90% at 50% 40%,#1A1A1F 0%,#0D0D0F 70%);box-shadow:0 40px 90px -50px rgba(22,21,26,.6);overflow:hidden}
.gstage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.gstage canvas.hovering{cursor:pointer}
.gcap{position:absolute;left:22px;bottom:18px;max-width:min(520px,calc(100% - 44px));font-size:15px;color:var(--fg-2);pointer-events:none;transition:opacity .4s}
.gcap b{color:var(--fg);font-weight:600}
.glegend{position:absolute;left:22px;top:18px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--fg-3);pointer-events:none;max-width:calc(100% - 44px)}
.glegend span{display:inline-flex;align-items:center;gap:7px}
.glegend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.glegend i.sq{border-radius:2px;background:var(--fg-3)}
.glegend i.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--miss)}
.gcard{position:absolute;right:16px;top:16px;width:min(360px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:rgba(20,20,23,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:18px;padding:20px 20px 18px;transition:transform .45s var(--ease),opacity .3s}
.gcard[data-empty="true"]{opacity:.96}
.gcard .type{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.gcard h3{font-size:24px;letter-spacing:-.025em;line-height:1.15;margin-top:8px}
.gcard p{color:var(--fg-2);font-size:14.5px;margin-top:10px;line-height:1.5}
.gcard h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:500;margin-top:18px}
.gcard .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gcard .links button{border:0;border-radius:8px;padding:5px 9px;font-size:13px;background:var(--stage-3);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}
.gcard .links button:hover{color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg-3)}
.gcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.gcard .acts .btn{padding:10px 16px;font-size:14px}
.gcard .close{position:absolute;right:12px;top:12px;border:0;background:var(--stage-3);border-radius:8px;width:30px;height:30px;color:var(--fg-2)}
.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:14px;color:var(--fg-3);align-items:start}
.steps li .s{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line-2);margin-top:2px;display:grid;place-items:center;font-size:10px}
.steps li.run{color:var(--fg)}
.steps li.run .s{box-shadow:inset 0 0 0 1.5px var(--signal);animation:pulse 1.2s infinite}
.steps li.done{color:var(--fg-2)}
.steps li.done .s{background:var(--signal);box-shadow:none;color:var(--signal-ink)}
.steps li small{display:block;color:var(--fg-3);font-size:12.5px}
@keyframes pulse{50%{box-shadow:inset 0 0 0 1.5px var(--signal),0 0 0 5px rgba(255,90,31,.18)}}
.affected{margin-top:12px;display:grid;gap:6px}
.affected div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:8px;background:rgba(255,181,71,.08);color:var(--fg)}
.affected div span{color:var(--amber);font-size:12px;white-space:nowrap}
.gnote{margin-top:14px;color:var(--fg-3);font-size:13.5px}
@media (max-width:760px){.glegend{display:none}.gstage{height:auto;display:flex;flex-direction:column}.gstage canvas{position:relative;height:460px}.gcard{position:relative;right:auto;top:auto;width:auto;margin:0 12px 12px;max-height:none}.gcap{display:none}}

/* Solutions */
.sol{background:var(--stage-2);border-block:1px solid var(--line);padding-block:120px}
.sol h2{font-size:clamp(40px,5.4vw,84px);letter-spacing:-.045em;max-width:14ch}
.sol .tabs{display:flex;gap:4px;margin-top:48px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.sol .tabs button{appearance:none;border:0;background:none;padding:16px 4px 18px;margin-right:28px;font-size:18px;font-weight:500;color:var(--fg-3);position:relative;white-space:nowrap}
.sol .tabs button{transition:color .2s ease,transform .16s var(--ease)}
.sol .tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.sol .tabs button[aria-selected="true"]{color:var(--fg)}
.sol .tabs button[aria-selected="true"]::after{transform:scaleX(1)}
.panel{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:56px;margin-top:56px;align-items:start}
.panel h3{font-size:clamp(32px,3.6vw,52px);letter-spacing:-.04em}
.panel .body{color:var(--fg-2);font-size:18px;margin-top:20px;max-width:46ch}
.panel .kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 32px;margin-top:36px}
.panel .kv dt{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.panel .kv dd{margin:6px 0 0;font-size:15px;color:var(--fg-2);line-height:1.5}
.sol-list{display:flex;flex-direction:column;gap:2px}
.sol-item{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:center;padding:16px 18px;border-radius:12px;background:var(--stage-3);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .25s,transform .25s var(--ease)}
@media (hover:hover) and (pointer:fine){.sol-item:hover{box-shadow:inset 0 0 0 1px var(--line-2);transform:translateX(4px)}}
.sol-item b{font-weight:600;font-size:16px}
.sol-item small{display:block;color:var(--fg-3);font-size:13.5px;margin-top:2px}
.sol-item .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--fg-3);text-transform:uppercase;white-space:nowrap}

.sol-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;margin-top:20px;color:var(--fg-3);font-size:14.5px}
.sol-foot button{border:0;background:none;color:var(--signal-text);font-weight:600;padding:0}
.sol-visual{margin-top:36px;border-radius:var(--r);overflow:hidden;aspect-ratio:16/7;max-width:100%;background:#fff}
.sol-visual img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:980px){.panel{grid-template-columns:minmax(0,1fr);gap:40px}.panel .kv{grid-template-columns:minmax(0,1fr)}}

/* Orchestration console */
.orch{padding-block:140px 120px}
.orch .grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start}
.orch h2{font-size:clamp(40px,5vw,76px);letter-spacing:-.045em}
.orch .lede{margin-top:22px}
.console{background:var(--stage-2);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.console form{display:flex;gap:10px;padding:16px;border-bottom:1px solid var(--line);align-items:center}
.console label.sr+input,.console input{flex:1;min-width:0;background:var(--stage);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;font-size:16px;color:var(--fg)}
.console input::placeholder{color:var(--fg-3)}
.console input:focus{outline:none;border-color:var(--signal)}

/* Company */
.beliefs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line)}
.belief{padding:32px 32px 32px 0;border-bottom:1px solid var(--line);min-width:0}
.belief:nth-child(even){padding-left:32px;border-left:1px solid var(--line)}
.belief h3{font-size:26px;letter-spacing:-.03em}
.belief p{color:var(--fg-2);margin-top:10px;font-size:16.5px;line-height:1.6;max-width:46ch}
@media (max-width:760px){.beliefs{grid-template-columns:minmax(0,1fr)}.belief:nth-child(even){padding-left:0;border-left:0}}
.commit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.commit div{background:var(--stage-3);border-radius:16px;padding:22px;box-shadow:inset 0 0 0 1px var(--line)}
.commit b{font-size:17px;display:block}
.commit p{color:var(--fg-2);font-size:15px;margin-top:6px;line-height:1.5}
@media (max-width:860px){.commit{grid-template-columns:minmax(0,1fr)}}
.banner{border-radius:28px;background:var(--signal);color:var(--signal-ink);padding:56px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.banner h2{font-size:clamp(34px,4.4vw,64px);letter-spacing:-.045em;max-width:16ch}
.banner p{margin-top:14px;font-size:18px;color:rgba(26,11,4,.8);max-width:46ch}
.banner .btn{background:var(--signal-ink);color:#FFF4EE}
@media (max-width:760px){.banner{grid-template-columns:minmax(0,1fr);padding:36px 24px}}

/* Contact */
.contact{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:64px;align-items:start}
.next-steps{list-style:none;margin:36px 0 0;padding:0;display:grid;gap:22px}
.next-steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px}
.next-steps .n{width:40px;height:40px;border-radius:50%;background:var(--signal-soft);color:var(--signal-text);display:grid;place-items:center;font-weight:600}
.next-steps b{font-size:18px;display:block}
.next-steps p{color:var(--fg-2);font-size:15.5px;margin-top:4px;line-height:1.55}
@media (max-width:980px){.contact{grid-template-columns:minmax(0,1fr)}}

/* Footer columns */
.fcols{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:32px;width:100%}
.fcols h4{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);font-weight:500;margin-bottom:12px}
.fcols ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fcols a{color:var(--fg-2)}
.fcols a:hover{color:var(--fg)}
.fcols p{margin-top:14px;max-width:32ch}
@media (max-width:760px){.fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.fcols>div:first-child{grid-column:1/-1}}
.view{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- Finish layer: cool white page, navy stages, wave-gradient hero, angled bands ---------- */
:root{
  --stage:#FFFFFF; --stage-2:#F6F9FC; --stage-3:#FFFFFF; --line:#E3E8EE; --line-2:#CBD4DE;
  --fg:#0A2540; --fg-2:#425466; --fg-3:#5A6B7D;
  --signal:#FF5A1F; --signal-text:#D9480F; --signal-ink:#1A0B04;
  --d-stage:#0A2540; --d-stage-2:#0D2B4A; --d-stage-3:#12345A; --d-line:#1E4167; --d-line-2:#2B5079;
  --d-fg:#F6F9FC; --d-fg-2:#ADBDCC; --d-fg-3:#93A6BA;
  --f-display:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --lift:0 50px 100px -20px rgba(50,50,93,.22),0 30px 60px -30px rgba(10,37,64,.28);
  --lift-sm:0 13px 27px -5px rgba(50,50,93,.18),0 8px 16px -8px rgba(10,37,64,.2);
}
.dark{--signal-text:#FF8A5C}
html{background:#fff}
body{font-size:17px;letter-spacing:-.003em}
body::before{background:#fff}
h1,h2{font-weight:600;letter-spacing:-.032em!important}
h3{letter-spacing:-.018em!important}
.nav{background:rgba(255,255,255,.8)}
.lede{color:var(--fg-2)}

/* Labels: sentence case, no mono caps */
.eyebrow{font-family:var(--f-body);font-size:16px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--signal-text)}
.kv dt,.kv4 dt,.panel .kv dt,.gcard h4,.gcard .type,.story .cols h4,.scn-card h4,.fcols h4,.next-v small,.lx-layer .num,.plane .lab,.mini .cols,.route .rh .mono,.flow li .st,.ck span{font-family:var(--f-body)!important;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;font-weight:600!important}
.gcard .type{font-size:12.5px!important}

/* Shape and depth: one radius scale (12px cards, pill controls) */
.cap-card,.solcard,.bignums div,.commit div,.pr,.sol-item,.flow li,.next-v a,.scn-card,.console,.form,.gcard,.kbp-tab,.lx-layer,.banner{border-radius:12px}
.gstage,.mini,.plane,.sol-visual{border-radius:16px}
.console,.form,.scn-card{box-shadow:var(--lift);border-color:transparent}
.cap-card,.solcard,.commit div,.pr,.bignums div:not(.hot),.next-v a,.sol-item{box-shadow:var(--lift-sm)}
.pr.accent,.cap-card.lead{box-shadow:var(--lift-sm),inset 0 0 0 1px rgba(255,90,31,.3)}
.btn-ghost{background:rgba(255,255,255,.7)}
.dark .btn-ghost{background:transparent}

/* Hero: navy stage with the live network (previous version) */
.hero.dark{background:var(--stage)}
.hero.dark::after{background:linear-gradient(90deg,rgba(10,37,64,.95) 0%,rgba(10,37,64,.62) 36%,rgba(10,37,64,0) 62%)}
@media (max-width:760px){.hero.dark::after{background:linear-gradient(180deg,rgba(10,37,64,.25) 0%,rgba(10,37,64,.94) 55%)}}

/* Proof band: angled bottom edge */
.proof{clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 3.2vw));padding-bottom:3.2vw;margin-top:-1px}
.proof .stat b{font-weight:600}

/* Knowledge graph: full navy band with angled edges */
.graph-band{position:relative;clip-path:polygon(0 5vw,100% 0,100% calc(100% - 5vw),0 100%);padding-block:5vw;margin-block:-2vw}
.graph-band .graph-sec{padding-block:96px 88px}
.graph-band .gstage{background:radial-gradient(120% 90% at 50% 40%,#0F3157 0%,#061B31 75%);box-shadow:inset 0 0 0 1px #1E4167}
.graph-band details{color:var(--fg-2)!important}
.mini{background:radial-gradient(120% 100% at 50% 30%,#0F3157 0%,#0A2540 70%)}
.page-hero.dark::after{background:linear-gradient(90deg,rgba(10,37,64,.96) 0%,rgba(10,37,64,.6) 42%,rgba(10,37,64,0) 72%)}
.page-hero.dark{background:#0A2540}

/* Problem section gets the guide lines too */
.problem{position:relative}
.shift .from::after{background:#8A99A8}
.problem h2 span{color:#8A99A8}

/* ---------- Cards: hairline + soft layered shadow, lift and spotlight border on hover ---------- */
:root{
  --card-sh:0 0 0 1px rgba(10,37,64,.07),0 1px 2px rgba(10,37,64,.04),0 6px 16px -6px rgba(10,37,64,.08);
  --card-sh-up:0 0 0 1px rgba(10,37,64,.06),0 30px 60px -16px rgba(50,50,93,.20),0 18px 36px -20px rgba(0,0,0,.16);
  --spring:cubic-bezier(.2,.8,.2,1);
}
.solcard,.cap-card,.pr,.commit div,.bignums div,.next-v a,.sol-item,.lx-panel{position:relative}
.solcard,.cap-card,.pr,.commit div,.bignums div,.next-v a,.sol-item,.lx-panel,.scn-card,.console,.form{border:0!important;background:#fff;box-shadow:var(--card-sh)!important;transition:transform .5s var(--spring),box-shadow .5s var(--spring),background-color .3s ease}
.console,.form,.scn-card{box-shadow:var(--card-sh-up)!important}
.bignums div.hot{background:var(--signal);box-shadow:0 18px 40px -18px rgba(255,90,31,.6)!important}
@media (hover:hover) and (pointer:fine){
  .solcard:hover,.cap-card:hover,.pr:hover,.commit div:hover,.bignums div:hover,.next-v a:hover,.sol-item:hover{transform:translateY(-4px);box-shadow:var(--card-sh-up)!important}
  .sol-item:hover{transform:translateY(-2px)}
}
/* spotlight: a 1px gradient border and faint wash that follow the cursor */
.solcard::after,.cap-card::after,.pr::after,.commit div::after,.bignums div::after,.next-v a::after,.sol-item::after,.lx-panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,90,31,.75),rgba(255,90,31,.15) 45%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:0;transition:opacity .4s ease;mix-blend-mode:normal;z-index:2}
.solcard::before,.cap-card::before,.pr::before,.commit div::before,.next-v a::before,.sol-item::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,90,31,.06),transparent 60%);opacity:0;transition:opacity .4s ease;width:auto;height:auto;right:0;top:0;left:0}
.lit::after,.lit::before{opacity:1!important}
.bignums div.hot::after{background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.9),transparent 70%)}
.solcard>*,.cap-card>*,.pr>*,.commit div>*,.next-v a>*{position:relative;z-index:1}

/* Solution cards */
.solcard{grid-template-columns:auto minmax(0,1fr);gap:4px 18px;padding:26px 28px 26px 26px;overflow:hidden}
.solcard .ix{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;padding:0;font-family:var(--f-body);font-weight:600;font-size:13px;color:var(--fg);background:color-mix(in srgb,var(--vc) 12%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--vc) 30%,transparent);transition:background .4s ease,color .4s ease}
.solcard:hover .ix{background:var(--vc);color:#fff}
.solcard h3{font-size:19px}
.solcard p{font-size:15px}
.cap-card{padding:26px;overflow:hidden}
.cap-card.lead,.pr.accent{background:linear-gradient(180deg,#FFF6F1 0%,#fff 60%)}
.pr{padding:26px}
.pr h3{font-size:20px}
.bignums b{display:block;font-size:48px}
.next-v a{padding:22px 24px}
.next-v a .arr{display:inline-block;transition:transform .4s var(--spring);color:var(--signal-text)}
.next-v a:hover .arr{transform:translateX(4px)}
.sol-list{gap:8px}
.sol-item{padding:16px 20px}

/* Phases and beliefs get a hover accent too */
.phase .dot{transition:transform .5s var(--spring),background .3s ease,color .3s}
.phase:hover .dot{transform:scale(1.12);background:var(--signal);color:var(--signal-ink)}
.belief h3{transition:color .3s ease}
.belief:hover h3{color:var(--signal-text)}

/* Staggered reveal: cards settle in once, in order, then stay put */
@media (prefers-reduced-motion:no-preference){
  .rv2{opacity:0}
  .rv2.in{animation:cardIn .9s var(--spring) both;animation-delay:calc(var(--i,0)*70ms)}
  @keyframes cardIn{from{opacity:0;translate:0 28px;scale:.985}to{opacity:1;translate:0 0;scale:1}}
  /* Decorative parallax only (never on content cards) */
  @supports (animation-timeline: view()){
    .hero canvas,.page-hero canvas.bg{animation:pxBg linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
    @keyframes pxBg{to{translate:0 24%}}
    .hero .wrap>*,.page-hero .wrap>*{animation:pxFade linear both;animation-timeline:view();animation-range:exit 10% exit 90%}
    @keyframes pxFade{to{translate:0 -60px;opacity:.15}}
    .stack{animation:pxFloat linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
    @keyframes pxFloat{from{translate:0 40px}to{translate:0 -40px}}
    .mini,.sol-visual{animation:pxFloat2 linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
    @keyframes pxFloat2{from{translate:0 24px}to{translate:0 -24px}}
    .people figure:nth-child(1){animation:pxF1 linear both;animation-timeline:view()}
    .people figure:nth-child(2){animation:pxF2 linear both;animation-timeline:view()}
    .people figure:nth-child(3){animation:pxF3 linear both;animation-timeline:view()}
    @keyframes pxF1{from{translate:0 40px}to{translate:0 -24px}}
    @keyframes pxF2{from{translate:0 8px}to{translate:0 -8px}}
    @keyframes pxF3{from{translate:0 64px}to{translate:0 -40px}}
  }
}

/* ---------- Scale: everything fits a laptop screen ---------- */
body{margin:0}
.hero .wrap{padding-block:96px 88px;min-height:min(680px,82dvh)}
.hero h1{font-size:clamp(40px,5.2vw,76px)}
.page-hero{padding-block:88px 72px}
.page-hero h1{font-size:clamp(38px,5vw,72px)}
.problem{padding-block:112px 96px}
.problem h2{font-size:clamp(32px,4.2vw,60px)}
.shift .to{font-size:clamp(60px,7vw,104px)}
.shift .from{font-size:32px}
.platform{padding-block:96px}
.platform h2,.graph-sec h2{font-size:clamp(38px,4.8vw,72px)}
.kbp{margin-top:48px}
.stack{height:460px}
.plane{width:380px;height:380px;margin:-190px 0 0 -190px}
.graph-band .graph-sec{padding-block:80px 72px}
.gstage{height:clamp(500px,68vh,680px)}
.sol{padding-block:96px}
.sol h2{font-size:clamp(34px,4.4vw,64px)}
.panel h3{font-size:clamp(28px,3vw,42px)}
.orch{padding-block:112px 96px}
.orch h2,.trust h2{font-size:clamp(34px,4.2vw,60px)}
.trust{padding-block:96px}
.principles{margin-top:48px}
.close-sec{padding-block:112px 96px}
.close-sec h2{font-size:clamp(38px,5.2vw,80px)}
.sec{padding-block:88px}
.sec h2{font-size:clamp(30px,3.8vw,52px)}
.sec-head{margin-bottom:40px}
.banner{padding:48px}
.banner h2{font-size:clamp(30px,3.6vw,48px)}
.story h3{font-size:clamp(26px,2.8vw,38px)}
@media (max-width:980px){.plane{width:300px;height:300px;margin:-150px 0 0 -150px}.stack{height:380px}}
@media (max-width:420px){.plane{width:250px;height:250px;margin:-125px 0 0 -125px}.stack{height:320px}}
@media (max-width:760px){.hero .wrap{padding-block:72px 64px}.page-hero{padding-block:64px 52px}.sec,.platform,.sol,.trust{padding-block:72px}.problem,.orch,.close-sec{padding-block:80px 72px}.banner{padding:32px 22px}.bignums b{font-size:40px}}

/* ---------- Kernel explorer: layer rail + one framed panel ---------- */
.lx{grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px}
.lx-stack{gap:4px;padding:0;position:sticky;top:104px}
.lx-stack::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,var(--line-2),var(--line-2) 60%,transparent);border-radius:2px}
.lx-layer{position:relative;grid-template-columns:36px minmax(0,1fr) auto;gap:16px;padding:14px 16px;border-radius:12px;background:transparent!important;box-shadow:none!important;transform:none!important;transition:background .25s ease}
.lx-layer:hover{background:var(--stage-2)!important}
.lx-layer .node{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg-3);background:#fff;box-shadow:inset 0 0 0 1.5px var(--line-2);transition:background .25s ease,color .25s ease,box-shadow .25s ease}
.lx-layer b{font-size:17px;color:var(--fg);transition:color .2s}
.lx-layer small{color:var(--fg-3)}
.lx-layer .ct{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--fg-3);min-width:26px;height:24px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--stage-2)}
.lx-layer[aria-selected="true"]{background:var(--fg)!important;box-shadow:0 10px 24px -12px rgba(10,37,64,.5)!important}
.lx-layer[aria-selected="true"] .node{background:var(--signal);color:var(--signal-ink);box-shadow:0 0 0 4px rgba(255,90,31,.22)}
.lx-layer[aria-selected="true"] b{color:#fff}
.lx-layer[aria-selected="true"] small{color:#ADBDCC}
.lx-layer[aria-selected="true"] .ct{background:rgba(255,255,255,.12);color:#fff}
.lx-layer.conn .node{box-shadow:inset 0 0 0 1.5px var(--line-2);background:repeating-linear-gradient(135deg,#fff 0 4px,var(--stage-2) 4px 8px)}
.lx-layer.conn[aria-selected="true"] .node{background:var(--signal)}

.lx-panel{border-radius:16px;background:#fff;overflow:hidden;min-width:0}
.lx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:28px 32px 24px;background:linear-gradient(180deg,#F6F9FC,#fff);border-bottom:1px solid var(--line)}
.lx-kick{font-size:13px;font-weight:600;color:var(--signal-text)}
.lx-head h3{font-size:clamp(26px,2.6vw,34px);letter-spacing:-.03em!important;margin-top:6px;line-height:1.05}
.lx-head p{color:var(--fg-3);margin-top:6px;font-size:15.5px}
.lx-count{font-size:14px;color:var(--fg-3);white-space:nowrap}
.lx-count b{font-size:28px;font-weight:600;color:var(--fg);letter-spacing:-.03em;margin-right:4px;font-variant-numeric:tabular-nums}
.lx-lead{position:relative;padding:28px 32px 28px 36px;border-bottom:1px solid var(--line);background:radial-gradient(600px 200px at 0% 0%,rgba(255,90,31,.09),transparent 70%)}
.lx-lead::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:3px;border-radius:0 3px 3px 0;background:var(--signal)}
.lx-tag{display:inline-flex;font-size:12.5px;font-weight:600;color:var(--signal-text);background:rgba(255,90,31,.1);border-radius:999px;padding:4px 10px}
.lx-lead h4{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-top:12px;line-height:1.2}
.lx-lead p{color:var(--fg-2);margin-top:8px;font-size:16.5px;line-height:1.6;max-width:62ch}
.lx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.lx-grid.one{grid-template-columns:minmax(0,1fr)}
.lx-grid:empty{display:none}
.lx-cap{background:#fff;padding:24px 32px 26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-content:start;transition:background .2s ease}
.lx-grid>.lx-cap:last-child:nth-child(odd){grid-column:1/-1}
@media (hover:hover) and (pointer:fine){.lx-cap:hover{background:#FBFCFE}.lx-cap:hover .ix{color:var(--signal-text);box-shadow:inset 0 0 0 1px rgba(255,90,31,.4)}}
.lx-cap .ix{grid-row:1/3;font-size:12px;font-weight:600;color:var(--fg-3);font-variant-numeric:tabular-nums;height:24px;min-width:32px;padding:0 6px;border-radius:6px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line);margin-top:1px;transition:color .2s,box-shadow .2s}
.lx-cap h4{font-size:18px;font-weight:600;letter-spacing:-.018em;line-height:1.3}
.lx-cap p{color:var(--fg-2);font-size:15px;line-height:1.55;margin-top:4px}
@media (max-width:980px){
  .lx{grid-template-columns:minmax(0,1fr);gap:20px}
  .lx-stack{position:static;flex-direction:row;flex-wrap:wrap;overflow:visible;gap:6px;padding-bottom:4px}
  .lx-stack::before{display:none}
  .lx-layer{flex:none;width:auto;grid-template-columns:30px auto;gap:10px;padding:10px 14px 10px 10px;box-shadow:inset 0 0 0 1px var(--line)!important}
  .lx-layer .node{width:30px;height:30px}
  .lx-layer small,.lx-layer .ct{display:none}
  .lx-head{padding:22px 20px 18px}.lx-lead{padding:22px 20px 22px 24px}.lx-cap{padding:20px}
  .lx-grid{grid-template-columns:minmax(0,1fr)}
}
.banner.long h2{font-size:clamp(24px,2.4vw,34px);max-width:30ch;line-height:1.2}
.banner{box-shadow:0 30px 60px -30px rgba(255,90,31,.55)}

/* ---------- Softer shadow on the console, form and step card ---------- */
.console,.form,.scn-card{box-shadow:0 0 0 1px rgba(10,37,64,.07),0 2px 4px rgba(10,37,64,.03),0 16px 32px -16px rgba(10,37,64,.14)!important;backdrop-filter:none;-webkit-backdrop-filter:none}
.close-sec .form{background:#fff}

/* ---------- Solutions dropdown: 2x2 grid, colour tiles, sliding highlight ---------- */
.dd-panel{left:-140px;width:580px;padding:0;border:0;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(10,37,64,.06),0 50px 100px -20px rgba(50,50,93,.25),0 30px 60px -30px rgba(0,0,0,.3);transform-origin:30% 0}
.dd-panel::before{content:"";position:absolute;top:-6px;left:170px;width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(10,37,64,.06)}
.dd-grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:10px}
.dd-hl{position:absolute;left:0;top:0;border-radius:10px;background:color-mix(in srgb,var(--c,#0A2540) 8%,#fff);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s cubic-bezier(.2,.8,.2,1),height .32s cubic-bezier(.2,.8,.2,1),opacity .2s ease,background-color .3s ease}

    .shift .to{animation:shTo linear both;animation-timeline:--prob;animation-range:entry 20% cover 60%;transform-origin:left bottom}
    .shift .bars .b1{animation:shBar linear both;animation-timeline:--prob;animation-range:entry 20% cover 50%}
    .shift .bars .b2{animation:shBar2 linear both;animation-timeline:--prob;animation-range:cover 35% cover 60%}
    .shift p{animation:shP linear both;animation-timeline:--prob;animation-range:entry 30% cover 55%}
    .problem .grid>div:first-child h2{animation:shH linear both;animation-timeline:--prob;animation-range:entry 0% cover 60%}
    @keyframes shFrom{from{translate:0 60px;opacity:0}60%{opacity:1}to{translate:0 -12px;opacity:1}}
    @keyframes shTo{from{translate:0 60px;scale:.86;opacity:0}to{translate:0 0;scale:1;opacity:1}}

    @keyframes shP{from{translate:0 40px;opacity:0}to{translate:0 0;opacity:1}}
    @keyframes shH{from{translate:0 40px}to{translate:0 -20px}}
  }
}

/* =========================================================================

   white surface, 16px radius, hairline + soft shadow, 2px lift on hover,
   no shadow change, no glow, no gradients
   ========================================================================= */
:root{--card-r:16px;--card-rest:0 0 0 1px rgba(10,37,64,.07),0 6px 16px -8px rgba(10,37,64,.08)}

.cell-d{background:#F6F9FC!important;border-radius:var(--card-r);box-shadow:var(--card-rest)!important}
.cell-a,.bignums div.hot{border-radius:var(--card-r)!important;box-shadow:none!important}
.pr.accent,.cap-card.lead{background:#fff!important}
.kv4.kvc div{background:#fff!important}
/* hover: same shadow, small lift */
@media (hover:hover) and (pointer:fine){
  .solcard:hover,.cap-card:hover,.pr:hover,.commit div:hover,.bignums div:hover,.next-v a:hover,.kv4.kvc div:hover,.cell:hover{transform:translateY(-2px)!important;box-shadow:var(--card-rest)!important}

}

.has-iso{--edge:rgba(10,37,64,.16);--p-t:#F6F9FC;--p-l:#E3E8EE;--p-r:#D5DDE6;--c-t:#FFFFFF;--c-l:#DCE4EE;--c-r:#BFCBD9;--k-t:#FF9A70;--k-l:#FF5A1F;--k-r:#D9480F}
